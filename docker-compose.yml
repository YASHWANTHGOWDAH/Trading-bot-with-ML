version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: trademind-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=trademind_ai
    networks:
      - trademind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trademind-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=trademind_ai
      - JWT_SECRET=trademind_ai_super_secret_jwt_key_2026_change_in_production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    depends_on:
      - mongodb
    networks:
      - trademind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trademind-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - trademind-network

volumes:
  mongodb_data:

networks:
  trademind-network:
    driver: bridge
