# ==============================================================================
# Render Blueprint Specification for TradeMind AI (Project Root)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: trademind-ai-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_NAME
        value: trademind_ai
      - key: MONGODB_URL
        sync: false # Enter your MongoDB Atlas connection string (mongodb+srv://...)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Set to your deployed frontend URL: https://trademind-ai-frontend.onrender.com
      - key: ENVIRONMENT
        value: production

  # ----------------------------------------------------------------------------
  # 2. React / Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: trademind-ai-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your deployed backend URL: https://trademind-ai-backend.onrender.com
